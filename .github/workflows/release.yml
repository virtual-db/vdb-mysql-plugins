# release.yml: the deploy pipeline. A tag vX.Y.Z runs CI, then builds and
# pushes, for every release in build/mysql-releases.txt, both architectures and
# both variants:
#   ghcr.io/virtual-db/vdb-mysql-plugins:<mysqld>-vX.Y.Z[-debug]          (dist)
#   ghcr.io/virtual-db/vdb-mysql-plugins:<mysqld>-vX.Y.Z[-debug]-<arch>-builder
# vdb-mysql pins the dist tag in its Dockerfile (PLUGINS_IMAGE).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: ci
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [release, debug]
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push every release in mysql-releases.txt
        run: |
          arch=$(uname -m)
          suffix=""; [ "${{ matrix.variant }}" = debug ] && suffix="-debug"
          grep -v '^#' build/mysql-releases.txt | while read -r ver url sha; do
            img=ghcr.io/virtual-db/vdb-mysql-plugins:${ver}-${GITHUB_REF_NAME}${suffix}-${arch}
            docker build --build-arg MYSQL_RELEASE=$ver --build-arg VARIANT=${{ matrix.variant }} \
              --label org.opencontainers.image.revision=${GITHUB_SHA} --target dist -t $img \
              --cache-from type=registry,ref=ghcr.io/virtual-db/vdb-mysql-plugins:buildcache .
            docker push $img
            docker build --build-arg MYSQL_RELEASE=$ver --build-arg VARIANT=${{ matrix.variant }} --target builder -t ${img}-builder .
            docker push ${img}-builder
          done
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures into one tag per release
        run: |
          grep -v '^#' build/mysql-releases.txt | while read -r ver url sha; do
            for s in "" "-debug"; do
              t=ghcr.io/virtual-db/vdb-mysql-plugins:${ver}-${GITHUB_REF_NAME}${s}
              docker buildx imagetools create -t $t ${t}-x86_64 ${t}-aarch64
            done
          done
