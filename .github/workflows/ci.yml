# ci.yml: Lint and Test on pull requests and on main; the job names are the
# status checks main's branch protection requires.
#   Lint  clang-format (pinned version) against .clang-format
#   Test  builds mysqld 8.4 and vdb.so, then checks mysqld loads vdb.so with
#         four ACTIVE plug-ins. The mysqld build is cached in the registry (written
#         with GITHUB_TOKEN), so only a change under build/ recompiles it; src/
#         changes rebuild vdb.so. This repository publishes no image (D-91).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CACHE: ghcr.io/virtual-db/vdb-mysql-plugins:buildcache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned so the check does not move with the runner image's clang-format.
      # Format locally with the same version: pip install clang-format==21.1.6
      - run: pipx install clang-format==21.1.6
      - name: clang-format
        run: find src -name '*.cc' -o -name '*.h' | xargs clang-format --style=file --dry-run --Werror

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space for the mysqld build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build mysqld and vdb.so
        run: |
          ver=$(grep -v '^#' build/mysql-releases.txt | head -1 | awk '{print $1}')
          push=(); [ "${{ github.event_name }}" = push ] || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] && \
            push=(--cache-to "type=registry,ref=$CACHE,mode=max")
          docker buildx build . --target installed --build-arg MYSQL_RELEASE="$ver" \
            --cache-from "type=registry,ref=$CACHE" "${push[@]}" --load -t installed
      - name: mysqld loads vdb.so and reports four ACTIVE plug-ins
        run: |
          # The installed stage stages the prefix under /out (DESTDIR); put it
          # where mysqld was configured to live so it finds its plugin dir.
          docker run --rm installed sh -c '
            cp -a /out/usr/local/mysql /usr/local/ &&
            /usr/local/mysql/bin/mysqld --no-defaults --initialize-insecure --datadir=/tmp/d --user=root &&
            (/usr/local/mysql/bin/mysqld --no-defaults --datadir=/tmp/d --user=root --plugin-load-add=vdb.so --socket=/tmp/s &)
            for i in $(seq 60); do /usr/local/mysql/bin/mysqladmin -uroot -S /tmp/s ping >/dev/null 2>&1 && break; sleep 1; done
            /usr/local/mysql/bin/mysql -uroot -S /tmp/s -N -e "SELECT COUNT(*) FROM information_schema.PLUGINS WHERE PLUGIN_NAME LIKE '\''vdb_mysql_%'\'' AND PLUGIN_STATUS='\''ACTIVE'\''" | grep -x 4'
